 <!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Prudence 2 | Christian News
</title>

<link
    rel="stylesheet"
    href="news.css"
>

<script
    type="module"
    src="news.js"
    defer>
</script>

</head>


<body>


<header>

    <div class="brand">
        ✝ PRUDENCE 2
    </div>


    <h1>
        Christian News
    </h1>


    <p>
        Faith. Truth. Hope.
    </p>


    <!-- =====================
         SUBSCRIBERS
    ====================== -->

    <div class="subscriber-summary">

        🔔

        <strong id="subscriberCount">
            0
        </strong>

        <span>
            Christian News Subscribers
        </span>

    </div>

</header>



<main class="container">


    <div id="newsContainer">

        <div class="loading">

            Loading Christian news...

        </div>

    </div>


</main>



<!-- =====================================
     NEWS ARTICLE TEMPLATE
===================================== -->

<template id="newsTemplate">


<div class="news-card">


    <!-- TITLE -->

    <h2 class="title">
    </h2>


    <!-- AUTHOR -->

    <p class="author">
    </p>


    <!-- IMAGE -->

    <img
        class="image"
        src=""
        alt="News Image"
    >


    <!-- VIDEO -->

    <video
        class="video"
        controls
        preload="metadata">
    </video>


    <!-- ARTICLE CONTENT -->

    <div class="content">
    </div>



    <!-- =================================
         STATISTICS
    ================================== -->

    <div class="statistics">


        <span>

            👁️

            <strong class="viewCount">
                0
            </strong>

            Views

        </span>


        <span>

            👍

            <strong class="likeCount">
                0
            </strong>

        </span>


        <span>

            👎

            <strong class="dislikeCount">
                0
            </strong>

        </span>


        <span>

            💬

            <strong class="commentCount">
                0
            </strong>

        </span>


    </div>



    <!-- =================================
         ACTION BUTTONS
    ================================== -->

    <div class="actions">


        <button
            type="button"
            class="likeBtn">

            👍 Like

        </button>


        <button
            type="button"
            class="dislikeBtn">

            👎 Dislike

        </button>


        <button
            type="button"
            class="commentBtn">

            💬 Comment

        </button>


        <button
            type="button"
            class="shareBtn">

            📤 Share

        </button>


        <button
            type="button"
            class="saveBtn">

            ⭐ Save

        </button>


        <button
            type="button"
            class="subscribeBtn">

            🔔 Subscribe

        </button>


    </div>



    <!-- =================================
         COMMENTS
    ================================== -->

    <section class="comments-section">


        <h3>

            💬 Comments

        </h3>


        <div class="commentForm">


            <textarea
                class="commentInput"
                placeholder="Write your comment..."
                rows="3">
            </textarea>


            <button
                type="button"
                class="postCommentBtn">

                Post Comment

            </button>


        </div>


        <div class="comments">

            Loading comments...

        </div>


    </section>


</div>


</template>


</body>

</html>
