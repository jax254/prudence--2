<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prudence 2 | News Approval Center</title>

<link rel="stylesheet" href="../css/approvals.css">

<script type="module" src="../js/approvals.js" defer></script>

</head>

<body>

<header>

<h1>✝ PRUDENCE 2</h1>

<h2>NEWS APPROVAL CENTER</h2>

<p>Review and manage submitted Christian news</p>

</header>


<main class="container">

<div class="top-bar">

<h2>Articles Awaiting Review</h2>

<button id="refreshButton">
🔄 Refresh
</button>

</div>


<div id="pendingNews">

<p>Loading pending news...</p>

</div>

</main>


<template id="newsTemplate">

<article class="news-card">

<div class="article-header">

<h2 class="title"></h2>

<span class="status"></span>

</div>


<p class="author"></p>

<p class="date"></p>


<img
class="image"
style="display:none;"
alt="News image"
>


<video
class="video"
controls
style="display:none;"
></video>


<div class="content"></div>


<textarea
class="feedback"
placeholder="Write feedback to the News Room provider..."
rows="4"
></textarea>


<div class="buttons">

<button class="editBtn">
✏️ Edit
</button>

<button class="approveBtn">
✅ Approve
</button>

<button class="rejectBtn">
❌ Reject
</button>

<button class="deleteBtn">
🗑️ Delete
</button>

</div>

</article>

</template>

</body>

  </html>
