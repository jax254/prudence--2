<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Prudence 2 | Admin Reels</title>

<link
    rel="stylesheet"
    href="admin-reels.css"
>

<script
    type="module"
    src="admin-reels.js"
    defer
></script>

</head>

<body>

<header>

    <div class="brand">
        ✝ PRUDENCE 2
    </div>

    <h1>🎬 REELS MODERATION</h1>

    <p>
        Review Christian Reels before they are published.
    </p>

</header>


<main class="admin-container">

    <div class="top-bar">

        <div>

            <h2>
                Pending Reels
            </h2>

            <p>
                Review and moderate submitted videos.
            </p>

        </div>

        <button
            id="backButton"
            type="button"
        >
            ← Admin Dashboard
        </button>

    </div>


    <div
        id="reelsContainer"
        class="reels-container"
    >

        <div class="loading">
            Loading pending Reels...
        </div>

    </div>

</main>

</body>

</html>
