<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Prudence 2 | News Approval</title>

<link rel="stylesheet" href="news-approval.css">

<script type="module" src="news-approval.js" defer></script>

</head>

<body>

<header>

<h1>
SUPER ADMIN NEWS APPROVAL
</h1>

<p>
Review and approve Christian news before publishing.
</p>

</header>


<div class="container">

<div id="newsList">

Loading pending articles...

</div>

</div>


<template id="newsTemplate">

<div class="news-card">

<h2 class="title"></h2>

<p class="author"></p>

<p class="date"></p>


<img
class="image"
src=""
alt="News Image"
style="display:none;">


<video
class="video"
controls
style="display:none;">
</video>


<div class="content"></div>


<textarea
class="feedback"
placeholder="Write feedback to the News Room provider...">
</textarea>


<div class="buttons">

<button class="approveBtn">
✅ Approve
</button>


<button class="rejectBtn">
↩️ Reject
</button>


<button class="deleteBtn">
🗑️ Delete
</button>


<button class="editBtn">
✏️ Edit
</button>

</div>

</div>

</template>

</body>

  </html>
