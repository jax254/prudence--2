<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prudence 2 | News</title>

<link rel="stylesheet" href="news.css">

<script
    type="module"
    src="news.js"
    defer>
</script>

</head>

<body>

<header>

    <div class="brand">
        ✝ Prudence 2
    </div>

    <h1>Christian News</h1>

    <p>Faith. Truth. Hope.</p>

</header>


<main class="container">

    <div id="newsContainer">

        <p>Loading news...</p>

    </div>

</main>


<!-- =========================
     NEWS ARTICLE TEMPLATE
========================= -->

<template id="newsTemplate">

<div class="news-card">


    <!-- TITLE -->

    <h2 class="title"></h2>


    <!-- AUTHOR -->

    <p class="author"></p>


    <!-- DATE -->

    <p class="date"></p>


    <!-- IMAGE -->

    <img
        class="image"
        src=""
        alt="News Image"
        style="display:none;"
    >


    <!-- VIDEO -->

    <video
        class="video"
        controls
        playsinline
        style="display:none;"
    ></video>


    <!-- ARTICLE -->

    <div class="content"></div>


    <!-- ACTIONS -->

    <div class="actions">

        <button
            type="button"
            class="likeBtn">
            👍 Like
        </button>


        <button
            type="button"
            class="commentBtn">
            💬 Comment
        </button>


        <button
            type="button"
            class="shareBtn">
            📤 Share
        </button>


        <button
            type="button"
            class="saveBtn">
            ⭐ Save
        </button>


        <button
            type="button"
            class="subscribeBtn">
            🔔 Subscribe
        </button>

    </div>


    <!-- COMMENTS -->

    <div class="comments"></div>


</div>

</template>


</body>

        </html>
