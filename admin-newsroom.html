<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prudence 2 | News Room</title>

<link rel="stylesheet" href="newsroom.css">

<script type="module" src="newsroom.js" defer></script>

</head>
     
<body>

<header>

<h1>PRUDENCE 2 NEWS ROOM</h1>

<p>Create Christian News for Review</p>

</header>


<div class="container">


<!-- =========================
     NEWS EDITOR
========================= -->

<div class="editor">

<h2>Write News Article</h2>


<form id="newsForm">


<input
type="text"
id="title"
placeholder="News Title"
required
>


<textarea
id="content"
rows="12"
placeholder="Write your Christian news article..."
required></textarea>


<label>
News Image
</label>

<input
type="file"
id="imageFile"
accept="image/*"
>


<label>
News Video
</label>

<input
type="file"
id="videoFile"
accept="video/*"
>


<div id="uploadStatus"></div>


<div class="editor-buttons">

<button
type="button"
id="saveDraft"
>
💾 Save Draft
</button>


<button
type="submit"
id="submitNews"
>
📤 Submit for Approval
</button>

</div>


</form>

</div>



<!-- =========================
     MY ARTICLES
========================= -->

<div class="articles">

<h2>My Articles</h2>


<div id="myArticles">

<p>Loading...</p>

</div>

</div>


</div>



<!-- =========================
     ARTICLE TEMPLATE
========================= -->

<template id="articleTemplate">

<div class="article-card">


<h3 class="articleTitle"></h3>


<p class="articleStatus"></p>


<p class="articleDate"></p>


<div class="article-actions">

<button
class="editButton"
>
✏️ Edit
</button>


<button
class="deleteButton"
>
🗑️ Delete
</button>

</div>


</div>

</template>


</body>

</html>
