<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Prudence 2 - Admin Chat</title>

<link
    rel="stylesheet"
    href="../css/admin-chat.css"
>

<script
    type="module"
    src="../js/admin-chat.js"
    defer
></script>

</head>

<body>

<header>

    <div class="brand">
        ✝ PRUDENCE 2
    </div>

    <h1>
        ADMIN STRATEGY CHAT
    </h1>

    <p>
        🔒 Private communication for authorized administrators
    </p>

</header>


<main class="chat-container">


    <section class="admin-chat-info">

        <div class="admin-chat-icon">
            🛡️
        </div>

        <div>

            <h2>
                Admin Team
            </h2>

            <p>
                Discuss Prudence 2 administration privately.
            </p>

        </div>

    </section>


    <section
        id="messages"
        class="messages"
    >

        <p>
            Loading messages...
        </p>

    </section>


    <section class="chat-box">

        <textarea
            id="message"
            placeholder="Type a private admin message..."
            rows="3"
            maxlength="2000"
        ></textarea>


        <button
            id="sendBtn"
            type="button"
        >
            SEND
        </button>

    </section>


    <p class="security-note">

        🔐 This area is restricted to authorized Prudence 2 administrators.

    </p>


</main>

</body>

</html>
