<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prudence 2 | Christian Chat</title>

<link rel="stylesheet" href="css/chat.css">

<script type="module" src="js/chat.js" defer></script>

</head>

<body>

<header>

<h1>Christian Fellowship Chat</h1>

<p>Encourage one another in Christ.</p>

</header>

<div class="container">

<div class="users-panel">

<h2>Members</h2>

<div id="usersList">
Loading members...
</div>

</div>

<div class="chat-panel">

<div id="chatMessages">

<p>Select a member to start chatting.</p>

</div>

<form id="chatForm">

<input
type="text"
id="message"
placeholder="Write your message..."
required>

<button type="submit">

Send

</button>

</form>

</div>

</div>

</body>

</html>
