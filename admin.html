<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prudence 2 - Admin Login</title>

    <link rel="stylesheet" href="../css/admin.css">

    <script type="module" src="../js/admin-login.js" defer></script>
</head>

<body>

<div class="container">

    <h1 class="title">
        PRUDENCE 2<br>
        ADMIN PORTAL
    </h1>

    <div class="login-box">

        <input
            type="password"
            id="passcode"
            placeholder="Admin Passcode"
            required>

        <input
            type="email"
            id="email"
            placeholder="Admin Email"
            required>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required>

        <button id="loginBtn" class="btn">
            SIGN IN
        </button>

        <button id="googleBtn" class="btn">
            SIGN IN WITH GOOGLE
        </button>

        <p class="note">
            Access is restricted to approved administrators only.
        </p>

    </div>

</div>

</body>
</html>
