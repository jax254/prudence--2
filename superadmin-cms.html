<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prudence 2 | CMS</title>

<link rel="stylesheet" href="../css/cms.css">

<script type="module" src="../js/cms.js" defer></script>

</head>

<body>

<header>

<h1>PRUDENCE 2 CONTENT MANAGEMENT SYSTEM</h1>

<p>Manage your Christian community website.</p>

</header>

<div class="container">

<section class="card">

<h2>Homepage Announcement</h2>

<textarea
id="announcement"
rows="5"
placeholder="Write an announcement..."></textarea>

<button id="saveAnnouncement">

Save Announcement

</button>

</section>

<section class="card">

<h2>Daily Bible Verse</h2>

<input
type="text"
id="verseReference"
placeholder="Example: John 3:16">

<textarea
id="verseText"
rows="4"
placeholder="Write the Bible verse..."></textarea>

<button id="saveVerse">

Save Bible Verse

</button>

</section>

<section class="card">

<h2>Website Features</h2>

<label><input type="checkbox" id="enableNews"> Enable News</label>

<label><input type="checkbox" id="enableChat"> Enable Chat</label>

<label><input type="checkbox" id="enablePrayer"> Enable Prayer</label>

<label><input type="checkbox" id="enableLive"> Enable Live</label>

<button id="saveFeatures">

Save Settings

</button>

</section>

<section class="card">

<h2>Send Notification</h2>

<textarea
id="notification"
rows="4"
placeholder="Message to all users..."></textarea>

<button id="sendNotification">

Send Notification

</button>

</section>

</div>

</body>

</html>
