<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prudence 2 | News Room</title>

<link rel="stylesheet" href="newsroom.css">

<script type="module" src="newsroom.js" defer></script>

</head>

<body>

<header>

<div class="brand">
    ✝ Prudence 2
</div>

<h1>PRUDENCE 2 NEWS ROOM</h1>

<p>Create Christian News for Review</p>

</header>


<div class="container">


<!-- =========================
     ARTICLE EDITOR
========================= -->

<section class="editor">

<h2 id="editorTitle">
Write News Article
</h2>


<form id="newsForm">


<input
type="text"
id="title"
placeholder="News Title"
required
>


<!-- TOOLBAR -->

<div class="toolbar">

<button type="button" data-command="bold">
    <b>B</b>
</button>

<button type="button" data-command="italic">
    <i>I</i>
</button>

<button type="button" data-command="underline">
    <u>U</u>
</button>

<button type="button" data-command="formatBlock" data-value="h2">
    H
</button>

<button type="button" data-command="insertUnorderedList">
    • List
</button>

<button type="button" data-command="insertOrderedList">
    1. List
</button>

<button type="button" data-command="createLink">
    🔗 Link
</button>

<button type="button" data-command="undo">
    ↶
</button>

<button type="button" data-command="redo">
    ↷
</button>

</div>


<!-- RICH TEXT EDITOR -->

<div
id="content"
class="content-editor"
contenteditable="true"
data-placeholder="Write your Christian news article..."
>
</div>


<input
type="url"
id="image"
placeholder="Image URL (Optional)"
>


<input
type="url"
id="video"
placeholder="Video URL (Optional)"
>


<div class="editor-buttons">

<button
type="button"
id="saveDraft"
class="draft-button"
>
💾 Save Draft
</button>


<button
type="button"
id="submitApproval"
class="submit-button"
>
📤 Submit for Approval
</button>


<button
type="button"
id="cancelEdit"
class="cancel-button"
style="display:none;"
>
Cancel Edit
</button>

</div>


</form>

</section>



<!-- =========================
     MY ARTICLES
========================= -->

<section class="articles">

<h2>
My Articles
</h2>


<div id="myArticles">

Loading...

</div>

</section>


</div>



<!-- =========================
     ARTICLE TEMPLATE
========================= -->

<template id="articleTemplate">

<div class="article-card">


<h3 class="articleTitle">
</h3>


<p class="articleStatus">
</p>


<p class="articleDate">
</p>


<div class="article-actions">

<button
class="editButton"
>
📝 Edit
</button>


<button
class="deleteButton"
>
🗑️ Delete
</button>


<button
class="submitButton"
>
📤 Submit
</button>

</div>


</div>

</template>


</body>

  </html>
