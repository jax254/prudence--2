  <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prudence 2 - Admin Dashboard</title>

    <link rel="stylesheet" href="admin-dashboard.css">

    <script type="module" src="admin-dashboard.js" defer></script>
</head>

<body>

<header>

    <h1>PRUDENCE 2 ADMIN PANEL</h1>

    <h3 id="adminName">Loading...</h3>

    <p id="adminRole">Administrator</p>

</header>


<section class="statistics">

    <div class="card">
        <h2 id="usersCount">0</h2>
        <p>Users</p>
    </div>

    <div class="card">
        <h2 id="newsCount">0</h2>
        <p>News Articles</p>
    </div>

    <div class="card">
        <h2 id="liveCount">0</h2>
        <p>Live Broadcasts</p>
    </div>

    <div class="card">
        <h2 id="pendingCount">0</h2>
        <p>Pending Approvals</p>
    </div>

</section>


<section class="menu">

    <button onclick="location.href='admin-newsroom.html'">
        📰 NEWS ROOM
    </button>

    <button onclick="location.href='admin-approvals.html'">
        ✅ NEWS APPROVALS
    </button>

    <button
        class="notification-menu-btn"
        onclick="location.href='notifications.html'"
    >
        🔔 NOTIFICATIONS

        <span
            id="notificationBadge"
            class="notification-badge"
            style="display:none;"
        >
            0
        </span>
    </button>

    <button onclick="location.href='admin-chat.html'">
        💬 ADMIN CHAT
    </button>


    <!-- SUPERADMIN ONLY -->

    <button
        id="adminManagementButton"
        style="display:none;"
        onclick="location.href='superadmin-admins.html'"
    >
        👑 ADMIN MANAGEMENT
    </button>


    <button onclick="location.href='settings.html'">
        ⚙️ WEBSITE SETTINGS
    </button>

    <button onclick="location.href='reports.html'">
        📊 REPORTS
    </button>

    <button onclick="logout()">
        🚪 LOGOUT
    </button>

</section>


<section class="recent">

    <h2>Pending News</h2>

    <div id="pendingNews">
        No pending news.
    </div>

</section>

</body>

</html>
