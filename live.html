<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prudence 2 | Live Gospel</title>

<link rel="stylesheet" href="css/live.css">

<script type="module" src="js/live.js" defer></script>

</head>

<body>

<header>

<h1>Live Gospel Broadcasting</h1>

<p>Preach the Gospel of our Lord Jesus Christ.</p>

</header>

<div class="container">

<div class="broadcast">

<video id="liveVideo" controls autoplay playsinline>

Your browser does not support video.

</video>

<div class="buttons">

<button id="startLive">

Start Live

</button>

<button id="endLive">

End Live

</button>

</div>

</div>

<div class="chat">

<h2>Live Comments</h2>

<div id="comments">

<p>No comments yet.</p>

</div>

<form id="commentForm">

<input
type="text"
id="commentInput"
placeholder="Write a comment..."
required>

<button type="submit">

Send

</button>

</form>

</div>

</div>

</body>

</html>
