<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prudence 2 - Admin Chat</title>

    <link
        rel="stylesheet"
        href="admin-chat.css"
    >

    <script
        type="module"
        src="admin-chat.js"
        defer
    ></script>

</head>


<body>


<header class="chat-header">

    <div class="brand">
        ✝ PRUDENCE 2
    </div>


    <h1>
        💬 ADMIN CHAT
    </h1>


    <p>
        🔒 Private communication for authorized administrators
    </p>


    <button
        type="button"
        class="back-button"
        onclick="location.href='admin-dashboard.html'"
    >
        ← Back to Admin Dashboard
    </button>

</header>


<main class="chat-container">


    <!-- =========================
         ADMIN INFORMATION
    ========================= -->

    <section class="admin-chat-info">

        <div class="admin-chat-icon">
            🛡️
        </div>


        <div class="admin-info-text">

            <h2>
                Admin Team
            </h2>

            <p>
                Private Prudence 2 administrator communication.
            </p>

        </div>


        <div
            id="connectionStatus"
            class="connection-status"
        >
            ● Connecting...
        </div>

    </section>


    <!-- =========================
         MESSAGES
    ========================= -->

    <section
        id="messages"
        class="messages"
    >

        <div class="loading">
            Loading admin messages...
        </div>

    </section>


    <!-- =========================
         COMPOSER
    ========================= -->

    <section class="chat-box">

        <textarea
            id="message"
            placeholder="Type a private admin message..."
            rows="2"
            maxlength="2000"
        ></textarea>


        <button
            id="sendBtn"
            type="button"
        >
            SEND ➤
        </button>

    </section>


    <p class="security-note">

        🔐 Only authorized administrators can access this chat.

    </p>


</main>


</body>

</html>
