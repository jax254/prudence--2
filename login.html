
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prudence 2 | Login</title>

<link rel="stylesheet" href="login.css">

<script type="module" src="login.js" defer></script>

</head>

<body>

<div class="container">

    <h1>
        WELCOME TO PRUDENCE WHERE WE SHINE TOGETHER
    </h1>

    <div class="login-box">

        <h2>Login</h2>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                LOGIN
            </button>

        </form>

        <button
            type="button"
            id="googleLogin"
        >
            Login With Google
        </button>

        <p>
            Don't have an account?
            <a href="signup.html">
                Sign Up
            </a>
        </p>

    </div>

</div>

</body>

</html>
