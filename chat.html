<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Prudence 2 | Christian Fellowship Chat</title>

<link
    rel="stylesheet"
    href="chat.css"
>

<script
    type="module"
    src="chat.js"
    defer
></script>

</head>


<body>


<header>

    <div class="brand">
        ✝ PRUDENCE 2
    </div>

    <h1>
        Christian Fellowship Chat
    </h1>

    <p>
        Encourage one another in Christ. ❤️
    </p>

</header>



<main class="chat-container">


    <section class="chat-header">

        <div>

            <h2>
                💬 General Fellowship
            </h2>

            <p>
                Welcome to the Prudence 2 Christian community.
            </p>

        </div>


        <div
            id="onlineStatus"
            class="online-status"
        >

            ● Connected

        </div>

    </section>



    <section
        id="chatMessages"
        class="chat-messages"
    >

        <div class="loading">

            Loading messages...

        </div>

    </section>



    <form
        id="chatForm"
        class="chat-form"
    >

        <textarea
            id="message"
            placeholder="Write something encouraging..."
            rows="1"
            maxlength="1000"
            required
        ></textarea>


        <button
            type="submit"
            id="sendButton"
        >

            Send ➤

        </button>

    </form>


    <p class="chat-note">

        Please be respectful, encouraging, and Christ-centered.

    </p>


</main>



</body>

</html>
