<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prudence 2 | Sign Up</title>

<link rel="stylesheet" href="css/signup.css">
<script type="module" src="js/signup.js" defer></script>

</head>


<body>

<div class="container">

    <div class="signup-box">

        <h1>
            WELCOME TO PRUDENCE
        </h1>

        <p class="welcome">
            WHERE WE SHINE TOGETHER
        </p>


        <h2>Create Account</h2>


        <form id="signupForm">

            <input
                type="text"
                id="username"
                placeholder="Choose a Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <input
                type="text"
                id="church"
                placeholder="Church (Optional)"
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >


            <!-- Terms and Conditions -->

            <label class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <span>
                    I agree to the
                    <a href="terms.html" target="_blank">
                        Terms of Service
                    </a>
                    and
                    <a href="privacy.html" target="_blank">
                        Privacy Policy
                    </a>.
                </span>

            </label>


            <button type="submit">
                SIGN UP
            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <!-- Google -->

        <button
            type="button"
            id="googleSignup"
        >
            Continue with Google
        </button>


        <p class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</div>

</body>

            </html>
