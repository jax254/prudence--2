<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Prudence 2 | Admin Management</title>

<link
    rel="stylesheet"
    href="../css/admins.css"
>

<script
    type="module"
    src="../js/admins.js"
    defer
></script>

</head>

<body>

<header>

    <h1>PRUDENCE 2</h1>

    <h2>ADMIN MANAGEMENT</h2>

    <p>
        Superadmin Control Center
    </p>

</header>


<main class="container">


    <!-- =========================
         ADD ADMIN
    ========================== -->

    <section class="panel">

        <h2>
            👤 Add Administrator
        </h2>

        <p class="description">

            Enter the email address of an existing
            Prudence 2 user and assign an administrator role.

        </p>


        <label for="adminEmail">
            User Email
        </label>

        <input
            type="email"
            id="adminEmail"
            placeholder="example@email.com"
            autocomplete="off"
        >


        <label for="adminRole">
            Administrator Role
        </label>

        <select id="adminRole">

            <option value="admin">
                Administrator
            </option>

            <option value="newsroom">
                Newsroom Admin
            </option>

            <option value="superadmin">
                Super Admin
            </option>

        </select>


        <button
            id="addAdmin"
            type="button"
            class="primary-button"
        >
            ADD ADMIN
        </button>


        <p
            id="adminMessage"
            class="message"
        ></p>

    </section>



    <!-- =========================
         ADMIN LIST
    ========================== -->

    <section class="panel">

        <div class="list-header">

            <div>

                <h2>
                    👥 Current Administrators
                </h2>

                <p class="description">
                    Only superadmins can manage these accounts.
                </p>

            </div>

        </div>


        <input
            type="search"
            id="searchAdmin"
            placeholder="Search by name or email..."
            autocomplete="off"
        >


        <div id="adminsContainer">

            <p class="loading">
                Loading administrators...
            </p>

        </div>

    </section>


</main>



<!-- =========================
     ADMIN CARD TEMPLATE
========================== -->

<template id="adminTemplate">

    <article class="admin-card">

        <div class="admin-info">

            <h3 class="name">
                Administrator
            </h3>

            <p class="email"></p>

            <p class="role"></p>

            <p class="status"></p>

        </div>


        <div class="buttons">

            <button
                type="button"
                class="promote"
            >
                CHANGE ROLE
            </button>


            <button
                type="button"
                class="remove"
            >
                REMOVE ADMIN
            </button>

        </div>

    </article>

</template>


<footer>

    <button
        type="button"
        onclick="history.back()"
        class="back-button"
    >
        ← BACK
    </button>

</footer>

</body>

</html>
