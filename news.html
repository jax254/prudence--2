<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prudence 2 | News</title>

<link rel="stylesheet" href="css/news.css">

<script type="module" src="js/news.js" defer></script>

</head>

<body>

<header>

<h1>Christian News</h1>

<p>Faith. Truth. Hope.</p>

</header>

<main class="container">

<div id="newsContainer">

<p>Loading news...</p>

</div>

</main>

<template id="newsTemplate">

<div class="news-card">

<h2 class="title"></h2>

<p class="author"></p>

<img class="image" src="" alt="News Image">

<p class="content"></p>

<div class="actions">

<button class="likeBtn">👍 Like</button>

<button class="commentBtn">💬 Comment</button>

<button class="shareBtn">📤 Share</button>

<button class="saveBtn">⭐ Save</button>

<button class="subscribeBtn">🔔 Subscribe</button>

</div>

<div class="comments"></div>

</div>

</template>

</body>

</html>
