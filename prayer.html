<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prudence 2 | Prayer Room</title>

<link rel="stylesheet" href="css/prayer.css">

<script type="module" src="js/prayer.js" defer></script>

</head>

<body>

<header>

<h1>Prayer Room</h1>

<p>Share your prayer requests and pray for one another.</p>

</header>

<div class="container">

<section class="prayer-form">

<h2>Submit a Prayer Request</h2>

<form id="prayerForm">

<input
type="text"
id="title"
placeholder="Prayer Title"
required>

<textarea
id="request"
rows="6"
placeholder="Write your prayer request..."
required></textarea>

<input
type="text"
id="bibleVerse"
placeholder="Bible Verse (Optional)">

<label>

<input
type="checkbox"
id="anonymous">

Post Anonymously

</label>

<button type="submit">

Submit Prayer

</button>

</form>

</section>

<section class="prayer-wall">

<h2>Prayer Wall</h2>

<div id="prayerContainer">

<p>Loading prayer requests...</p>

</div>

</section>

</div>

<template id="prayerTemplate">

<div class="prayer-card">

<h3 class="prayerTitle"></h3>

<p class="prayerAuthor"></p>

<p class="prayerText"></p>

<p class="prayerVerse"></p>

<div class="actions">

<button class="prayButton">

🙏 I Prayed

</button>

<button class="commentButton">

💬 Comment

</button>

<button class="shareButton">

📤 Share

</button>

</div>

<div class="comments"></div>

</div>

</template>

</body>

</html>
