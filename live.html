<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prudence 2 | Live Gospel</title>

<link rel="stylesheet" href="live.css">

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script type="module" src="live.js" defer></script>

</head>

<body>

<header>
    <div class="brand">✝ Prudence 2</div>

    <h1>Live Gospel Broadcasting</h1>

    <p>Preach the Gospel of our Lord Jesus Christ.</p>
</header>


<main class="container">

    <section class="broadcast">

        <h2 id="status">Ready</h2>

        <div id="videoContainer">

            <video
                id="liveVideo"
                autoplay
                playsinline
                muted>
            </video>

        </div>


         <div class="buttons">

    <button id="requestBroadcast">
        Request to Broadcast
    </button>

    <button id="startLive">
        Start Live
    </button>

    <button id="joinLive">
        Join Live
    </button>

    <button id="endLive">
        End Live
    </button>

</div>

<p id="broadcastRequestStatus"></p>

    </section>


    <section class="chat">

        <h2>Live Comments</h2>

        <div id="comments">

            <p>No comments yet.</p>

        </div>


        <form id="commentForm">

            <input
                type="text"
                id="commentInput"
                placeholder="Write a comment..."
                required>

            <button type="submit">
                Send
            </button>

        </form>

    </section>

</main>

</body>
</html>
