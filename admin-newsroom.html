<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prudence 2 | News Room</title>

<link rel="stylesheet" href="newsroom.css">

<script type="module" src="newsroom.js" defer></script>

</head>

<body>

<header>

<div class="brand">✝ PRUDENCE 2</div>

<h1>NEWS ROOM</h1>

<p>Create, edit and publish Christian news</p>

</header>


<main class="container">


<!-- =========================
     EDITOR
========================= -->

<section class="editor">

<h2 id="editorHeading">
Write News Article
</h2>


<form id="newsForm">


<input
type="text"
id="title"
placeholder="News Title"
required
>


<!-- TOOLBAR -->

<div class="toolbar">

<button type="button" data-command="bold">
<b>B</b>
</button>

<button type="button" data-command="italic">
<i>I</i>
</button>

<button type="button" data-command="underline">
<u>U</u>
</button>

<button type="button" data-command="insertUnorderedList">
☷ List
</button>

<button type="button" data-command="insertOrderedList">
1. List
</button>

<button type="button" id="linkButton">
🔗 Link
</button>

<button type="button" id="undoButton">
↶
</button>

<button type="button" id="redoButton">
↷
</button>

</div>


<!-- ARTICLE EDITOR -->

<div
id="content"
class="content-editor"
     <div class="writing-checker">

    <button
        type="button"
        id="checkWritingBtn">
        ✨ Check Spelling & Grammar
    </button>

    <div
        id="writingResults"
        class="writing-results"
        style="display:none;">
    </div>

</div>
contenteditable="true"
data-placeholder="Write your Christian news article..."
></div>


<!-- IMAGE -->

<label class="upload-label">

📷 News Image

<input
type="file"
id="imageFile"
accept="image/*"
>

</label>

<div id="imagePreview"></div>


<!-- VIDEO -->

<label class="upload-label">

🎥 News Video

<input
type="file"
id="videoFile"
accept="video/*"
>

</label>

<div id="videoPreview"></div>


<!-- ACTIONS -->

<div class="editor-actions">

<button
type="button"
id="saveDraft"
class="draft-button"
>
💾 Save Draft
</button>


<button
type="submit"
id="submitNews"
class="submit-button"
>
📤 Submit for Approval
</button>


<button
type="button"
id="cancelEdit"
class="cancel-button"
style="display:none;"
>
Cancel Edit
</button>

</div>


</form>

</section>



<!-- =========================
     MY ARTICLES
========================= -->

<section class="articles">

<h2>My Articles</h2>

<div id="myArticles">

Loading...

</div>

</section>


</main>


<!-- =========================
     ARTICLE TEMPLATE
========================= -->

<template id="articleTemplate">

    <div class="article-card">

        <h3 class="articleTitle"></h3>

        <p class="articleStatus"></p>

        <p class="articleDate"></p>

        <div class="article-actions">

            <button
                type="button"
                class="editButton">
                ✏️ Edit
            </button>

            <button
                type="button"
                class="deleteButton">
                🗑️ Delete
            </button>

        </div>

    </div>

</template>


</body>

     </html>
