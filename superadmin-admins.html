  <!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Prudence 2 | Admin Management</title>

<link
    rel="stylesheet"
    href="../css/admins.css"
>

<script
    type="module"
    src="../js/admins.js"
    defer
></script>

</head>


<body>


<header>

    <div class="brand">
        ✝ PRUDENCE 2
    </div>

    <h1>
        👑 SUPERADMIN
    </h1>

    <p>
        Administrator Management
    </p>

</header>


<main class="container">


    <div class="top-actions">

        <button
            type="button"
            onclick="location.href='admin-dashboard.html'"
        >
            ← Back to Admin Panel
        </button>

    </div>


    <section class="add-admin">

        <h2>
            Add Administrator
        </h2>

        <p class="description">
            Search for an existing Prudence 2 user
            and assign an administrator role.
        </p>


        <input
            type="text"
            id="adminSearch"
            placeholder="Search by email or username..."
            autocomplete="off"
        >


        <div
            id="searchResults"
            class="search-results"
        ></div>


        <div
            id="selectedUser"
            class="selected-user"
            style="display:none;"
        >

            <strong>
                Selected User
            </strong>

            <span id="selectedUserName"></span>

            <span id="selectedUserEmail"></span>

        </div>


        <select id="adminRole">

            <option value="admin">
                Administrator
            </option>

            <option value="newsroom">
                Newsroom Admin
            </option>

        </select>


        <button
            type="button"
            id="addAdmin"
        >
            ➕ Make Administrator
        </button>

    </section>



    <section class="admin-list">

        <div class="section-heading">

            <div>

                <h2>
                    Current Administrators
                </h2>

                <p>
                    Only the Superadmin can change these roles.
                </p>

            </div>

        </div>


        <input
            type="text"
            id="searchAdmin"
            placeholder="Search administrators..."
        >


        <div
            id="adminsContainer"
        >

            Loading administrators...

        </div>

    </section>


</main>


<template id="adminTemplate">

    <article class="admin-card">


        <div class="admin-information">

            <div class="admin-avatar">
                👤
            </div>


            <div>

                <h3 class="name">
                    User
                </h3>

                <p class="email">
                    email
                </p>

                <p class="role">
                    Role
                </p>

                <p class="status">
                    Status
                </p>

            </div>

        </div>


        <div class="buttons">


            <button
                type="button"
                class="promote"
            >
                🔼 Change Role
            </button>


            <button
                type="button"
                class="remove"
            >
                🚫 Remove Admin
            </button>


        </div>


    </article>

</template>


</body>

</html>
